# Two containers, one volume — docs/01-architecture.md. Copy .env.example to
# .env, adjust, then `docker compose up -d`. Put a cloudflared tunnel (or any
# real-HTTPS reverse proxy) in front of the app container; iOS gives you no
# OPFS/service worker/home-screen install without it.
services:
  server:
    # `docker compose up -d` pulls this from GHCR; `up -d --build` builds it
    # from source under the same tag. Set PWA_YT_TAG to pin a release
    # (e.g. 0.9.0) instead of tracking latest.
    image: ghcr.io/iamdoubz/pwa-yt-server:${PWA_YT_TAG:-latest}
    build:
      context: ./server
      platforms: [linux/amd64]
    platform: linux/amd64
    restart: unless-stopped
    environment:
      PWA_YT_ORIGINS: ${PWA_YT_ORIGINS:-*}
      PWA_YT_RP_ID: ${PWA_YT_RP_ID:-localhost}
      PWA_YT_COOKIE_KEY: ${PWA_YT_COOKIE_KEY:-}
      PWA_YT_ENABLE_DOCS: ${PWA_YT_ENABLE_DOCS:-}
    volumes:
      - db:/data
    tmpfs:
      - /app/scratch

  app:
    image: ghcr.io/iamdoubz/pwa-yt-app:${PWA_YT_TAG:-latest}
    build:
      context: ./app
      platforms: [linux/amd64]
    platform: linux/amd64
    environment:
      # Applied at container start, so this works on a pulled image and takes
      # effect on `docker compose up -d` with no rebuild. Blank is fine — the
      # link-preview URLs stay relative. See app/docker-entrypoint.d/.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"

volumes:
  db:
