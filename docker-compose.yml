# Two containers, one volume — docs/01-architecture.md. Copy .env.example to
# .env, adjust, then `docker compose up -d`. Put a cloudflared tunnel (or any
# real-HTTPS reverse proxy) in front of the app container; iOS gives you no
# OPFS/service worker/home-screen install without it.
services:
  server:
    build:
      context: ./server
      platforms: [linux/amd64]
    platform: linux/amd64
    restart: unless-stopped
    environment:
      PWA_YT_ORIGINS: ${PWA_YT_ORIGINS:-*}
      PWA_YT_RP_ID: ${PWA_YT_RP_ID:-localhost}
      PWA_YT_COOKIE_KEY: ${PWA_YT_COOKIE_KEY:-}
      PWA_YT_ENABLE_DOCS: ${PWA_YT_ENABLE_DOCS:-}
    volumes:
      - db:/data
    tmpfs:
      - /app/scratch

  app:
    build:
      context: ./app
      platforms: [linux/amd64]
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"

volumes:
  db:
