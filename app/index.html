<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0b0c" id="theme-color-meta" />
    <title>PWA-YT</title>
    <meta name="description" content="Download music once, listen offline forever. A self-hosted PWA that keeps your library on your device, not on a server." />

    <!-- Self-hosted, precached with the rest of the shell. No CDN, ever. -->
    <link rel="icon" type="image/png" href="/imgs/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/imgs/favicon.svg" />
    <link rel="shortcut icon" href="/imgs/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/imgs/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="PWA-YT" />
    <!-- The manifest link is injected by vite-plugin-pwa (/manifest.webmanifest).
         Do not add a second one here — a page gets one manifest, the first link
         wins, and which one that is would depend on injection order. The new
         icons are wired into that manifest in vite.config.js instead. -->

    <!-- Link previews. The OG_ORIGIN placeholder below (percent-delimited, so
         not written out here — it would be substituted in this comment too) is
         PUBLIC_ORIGIN. Two moments, one variable: vite.config.js substitutes
         it at build time for `npm run dev` / `npm run build`, while the Docker
         image ships these relative and rewrites them when the container starts
         (app/docker-entrypoint.d/40-og-origin.sh) — a published image is
         pulled onto hostnames it cannot know at build time. Absolute is what
         Facebook and X require; blank leaves them relative, which
         Slack/iMessage/Discord resolve against the page URL anyway. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PWA-YT" />
    <meta property="og:title" content="PWA-YT" />
    <meta property="og:description" content="Download music once, listen offline forever. A self-hosted PWA that keeps your library on your device, not on a server." />
    <meta property="og:url" content="%OG_ORIGIN%/" />
    <meta property="og:image" content="%OG_ORIGIN%/imgs/opengraph.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="PWA-YT — offline-first music downloader" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PWA-YT" />
    <meta name="twitter:description" content="Download music once, listen offline forever. A self-hosted PWA that keeps your library on your device, not on a server." />
    <meta name="twitter:image" content="%OG_ORIGIN%/imgs/opengraph.png" />
    <script>
      // Runs before first paint so a light-mode choice never flashes dark
      // first. Dark stays the default (no attribute) — see D-029.
      try {
        if (localStorage.getItem('pwa-yt-theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
