server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Service worker and its Workbox chunks must always be revalidated — an
    # offline install must never get stuck on a stale shell (docs/02-offline-playback.md).
    location ~* (sw\.js|registerSW\.js|workbox-.*\.js)$ {
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|ico|webmanifest)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Same-origin API, no CORS — mirrors the vite dev proxy in vite.config.js
    # so a cloudflared tunnel in front of this container needs no config.
    #
    # ^~ matters: regex locations (the asset-cache and sw.js rules above)
    # otherwise take priority over a plain prefix match regardless of file
    # order, so an artifact path ending in .jpg/.m4a etc. would get treated
    # as a static file under /usr/share/nginx/html instead of reaching the
    # server — which is exactly what happened to .../artifact/art.jpg.
    location ^~ /api/ {
        proxy_pass http://server:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # /jobs/stream is SSE: without these, nginx defaults to HTTP/1.0 to the
        # upstream, which has no chunked encoding, so it buffers the entire
        # response until the connection closes at SSE_MAX_S (5 min) instead of
        # relaying each `data:` line as main.py yields it. The app already
        # sends X-Accel-Buffering: no, but that alone wasn't enough — every
        # job update showed up 5 minutes late instead of in real time.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
