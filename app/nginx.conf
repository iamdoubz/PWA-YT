server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Service worker and its Workbox chunks must always be revalidated — an
    # offline install must never get stuck on a stale shell (docs/02-offline-playback.md).
    location ~* (sw\.js|registerSW\.js|workbox-.*\.js)$ {
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|ico|webmanifest)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Same-origin API, no CORS — mirrors the vite dev proxy in vite.config.js
    # so a cloudflared tunnel in front of this container needs no config.
    location /api/ {
        proxy_pass http://server:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
